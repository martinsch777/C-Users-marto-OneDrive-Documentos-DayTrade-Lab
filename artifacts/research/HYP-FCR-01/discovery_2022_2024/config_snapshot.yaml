  full_file_sha256_note: The full file SHA-256 is reported in docs/HYP_FIRST_CANDLE_PREREGISTRATION.md after materialization.

research_question:
  alternative_hypothesis: >
    After price touches one extreme of the 09:30-10:00 opening range, a contrary
    FVG confirmed by a strict close back inside the range has positive net
    expectancy using a 2R target.
  null_hypothesis: >
    Net expectancy is less than or equal to zero after commissions, slippage,
    and conservative intrabar resolution.

periods:
  discovery:
    start: "2022-01-01"
    end: "2024-12-31"
    executable_now: false
  validation:
    start: "2025-01-01"
    end: "2025-12-31"
    blocked_until_discovery_gate_passes: true
    executable_now: false
  holdout_2026:
    status: observed_contaminated_non_decisional
    reason: TradingView results were already observed during 2026 for QQQ, VOO, SMH, and SOXL.
    allowed_future_use: parity_debug_only
    prohibited_use:
      - profitability_conclusion
      - parameter_selection
      - strategy_approval
  true_holdout:
    type: forward_paper_after_final_freeze
    executable_now: false

universe:
