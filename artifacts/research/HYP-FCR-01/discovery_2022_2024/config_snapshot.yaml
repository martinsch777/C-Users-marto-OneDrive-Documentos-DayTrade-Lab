    create_now: false
    execute_now: false

signal_rules:
  source_timeframe: 1min
  signal_timeframe: 5min
  resampling:
    timezone: America/New_York
    bar_opens: ["09:30", "09:35", "09:40", "...", "15:55"]
    source: audited_1min_only
  opening_range:
    start: "09:30"
    end_exclusive: "10:00"
    required_bars: 6
    high: max_high_over_six_bars
    low: min_low_over_six_bars
    available_from: "10:00"
  entries:
    start: "10:00"
    end_exclusive: "15:55"
    max_trades_per_symbol_session: 1
    long_enabled: true
    short_enabled: true
    pyramiding: 0
  sweep:
    long_touch: low <= opening_low
    short_touch: high >= opening_high
    tolerance_ticks: 0
    strict_break_required: false
    exact_touch_counts: true
    most_recent_touch_updates: true
    confirmation_must_be_after_most_recent_touch: true
    same_bar_confirmation_allowed: false
  fvg:
    mode: Solo FVG
    smart_money_push_enabled: false
    bullish: low[t] > high[t-2]
    bearish: high[t] < low[t-2]
    minimum_fvg_ticks: 0
    strict_positive_gap_required: true
  back_inside_opening_range:
    long: close > opening_low and close < opening_high
    short: close < opening_high and close > opening_low
    strict_inequalities: true
    close_on_edge_counts: false
  simultaneous_signals:
    if_long_and_short_same_bar: no_trade
    record_diagnostic: true

risk:
  initial_capital_parity_usd: 1000
  reward_risk: 2.0
  risk_percent_of_equity_before_trade: 0.005
  max_notional_percent_of_equity: 1.0
  quantity_step: 1
  minimum_quantity: 1
  pointvalue_equivalent: 1
  position_sizing:
    - risk_capital = equity * 0.005
    - risk_quantity = risk_capital / risk_per_unit
    - maximum_quantity_by_notional = equity / price
    - raw_quantity = min(risk_quantity, maximum_quantity_by_notional)
    - quantity = floor(raw_quantity)
    - reject_if_quantity_less_than_1
  stop:
    long: min(min(open, close) over signal bar and two prior bars) - 1 tick
    short: max(max(open, close) over signal bar and two prior bars) + 1 tick
    use_full_high_low: false
    use_original_opening_range_extreme: false
    move_after_entry: false
  target:
    long: signal_close + 2 * (signal_close - stop)
    short: signal_close - 2 * (stop - signal_close)
    frozen_from_signal_close: true
    recalculate_after_real_fill: false

costs:
  tick_size: 0.01
  baseline:
    commission_rate_per_side: 0.0001
    slippage_ticks_per_execution: 1
  stress:
    commission_rate_per_side: 0.0002
    slippage_ticks_per_execution: 2
  severe:
    commission_rate_per_side: 0.0003
    slippage_ticks_per_execution: 3

execution_modes:
  tradingview_parity:
    purpose: operation_by_operation_comparison_with_pine_not_economic_approval
    decision_time: signal_bar_close
    entry_reference: signal_close
    apply_adverse_slippage: true
    stop_and_target_from: signal_close
    quantity: integer_shares
    fixed_close_logic: Pine 15:55-16:00 exitSession
    early_close_source_semantics_preserved: true
    correct_early_close_bug: false
  research_primary:
    purpose: only_mode_eligible_for_economic_conclusions
    signal_known_at: five_minute_bar_close
    entry: next_available_one_minute_open
    apply_adverse_slippage: true
    stop_and_target_from: signal_close
    intrabar_data: audited_1min
    same_minute_tp_sl_policy: stop_first
    gap_through_stop: fill_worst_of_stop_or_open_plus_adverse_slippage
    gap_through_target: fill_target_without_price_improvement
    forced_exit: true_session_close_from_US_EQUITY_RTH
    overnight_allowed: false
    early_close_exit: effective_session_close
    fixed_1555_close_used: false

