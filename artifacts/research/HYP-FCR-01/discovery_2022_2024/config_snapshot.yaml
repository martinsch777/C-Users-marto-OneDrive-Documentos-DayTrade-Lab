    minimum_completed_trades_per_symbol: 50
    baseline_net_expectancy_R_gt: 0
    baseline_profit_factor_net_gte: 1.15
    baseline_each_symbol_net_positive:
      - QQQ
      - SPY
    stress_net_expectancy_R_gte: 0
    stress_profit_factor_net_gte: 1.00
    minimum_positive_discovery_years: 2
    max_single_year_profit_share: 0.70
    maximum_drawdown_lte: 0.10
  if_any_fail:
