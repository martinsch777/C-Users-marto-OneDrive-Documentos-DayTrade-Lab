hypothesis_name: Causal Session VWAP Deviation Mean Reversion
name: Causal Session VWAP Deviation Mean Reversion
research_type: causal_event_study
type: causal_event_study
status: preregistered_not_executed
design_status: human_approved
conceptual_design_freeze_commit: 5a0c3dee3af99093fb5ff5eb2ab641767d1e086f
clarification_id: HYP-VWAP-DEV-01-CLAR-01
clarification_freeze_commit: 9d2bbf721c70da7a4b02df49d9973cffc77c09f6
clarification_status: frozen
clarification_classification: non_methodological_logical_clarification
clarification_change_control:
  selection_changed: false
  timing_changed: false
  threshold_changed: false
  returns_changed: false
  costs_changed: false
  control_changed: false
  bootstrap_changed: false
  gate_thresholds_changed: false
  temporal_partitions_changed: false
  decision_variants_changed: false
